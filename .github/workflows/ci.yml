name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        shell: pwsh
        run: |
          $ProgramName = "NaxStudio Flow"
          $SafeRef = ("${{ github.ref_name }}" -replace '[^a-zA-Z0-9._-]', '-')
          $ShortSha = "${{ github.sha }}".Substring(0, 7)
          $Version = "dev-${SafeRef}-${ShortSha}"

          "PROGRAM_NAME=$ProgramName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION_MAJOR=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION_MINOR=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION_PATCH=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $DistDir = "out"
          if (Test-Path $DistDir) { Remove-Item -Recurse -Force $DistDir }
          New-Item -ItemType Directory -Path $DistDir | Out-Null
          New-Item -ItemType Directory -Path "$DistDir/dist_files" | Out-Null
          New-Item -ItemType Directory -Path "$DistDir/windows" | Out-Null
          New-Item -ItemType Directory -Path "$DistDir/ubuntu" | Out-Null

          "DIST_DIR=$DistDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DIST_FILES_DIR=$DistDir/dist_files" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DIST_WINDOWS_DIR=$DistDir/windows" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DIST_UBUNTU_DIR=$DistDir/ubuntu" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            patchelf \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libasound2-dev \
            libpulse0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install Qt (Windows)
        if: matrix.os == 'windows-latest'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia'

      - name: Install Qt (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: 'desktop'
          modules: 'qtmultimedia'

      - name: Build, Test and Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./.github/scripts/BuildWindows.ps1

      - name: Build, Test and Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash ./.github/scripts/BuildLinux.sh

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: out/dist_files/*
          if-no-files-found: error
